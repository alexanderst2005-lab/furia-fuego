<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="600" height="450">
  <defs>
    <radialGradient id="bgBrownie" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3D000A"/>
      <stop offset="100%" stop-color="#0A0A0A"/>
    </radialGradient>
  </defs>
  
  <rect width="600" height="450" fill="url(#bgBrownie)"/>

  <!-- Plate -->
  <ellipse cx="300" cy="370" rx="200" ry="40" fill="#151515" stroke="#FF5500" stroke-width="2"/>

  <!-- Sizzling Skillet / Pan -->
  <ellipse cx="300" cy="365" rx="170" ry="32" fill="#262626"/>

  <!-- Warm Fudgy Brownie -->
  <rect x="210" y="270" width="180" height="70" rx="8" fill="#3D1A10"/>
  <rect x="210" y="270" width="180" height="20" rx="4" fill="#5A2A1B"/>

  <!-- Melting Vanilla Ice Cream -->
  <path d="M 230 270 Q 300 170 370 270 Z" fill="#FFFDF0"/>

  <!-- Hot Chocolate Fudge Dripping -->
  <path d="M 250 220 Q 260 250 255 290" fill="none" stroke="#2B1008" stroke-width="12" stroke-linecap="round"/>
  <path d="M 300 190 Q 310 240 305 310" fill="none" stroke="#2B1008" stroke-width="14" stroke-linecap="round"/>
  <path d="M 340 230 Q 330 260 345 295" fill="none" stroke="#2B1008" stroke-width="10" stroke-linecap="round"/>

  <!-- Title Badge Overlay -->
  <rect x="20" y="20" width="200" height="40" rx="20" fill="#FF5500"/>
  <text x="120" y="46" font-family="'Bebas Neue', sans-serif" font-size="24" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">🔥 FUEGO BROWNIE</text>
</svg>
