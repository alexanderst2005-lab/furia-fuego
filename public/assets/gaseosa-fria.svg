<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="600" height="450">
  <defs>
    <radialGradient id="bgSoda" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#300500"/>
      <stop offset="100%" stop-color="#0A0A0A"/>
    </radialGradient>
    <linearGradient id="colaLiquid" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7A1D00"/>
      <stop offset="100%" stop-color="#1F0700"/>
    </linearGradient>
  </defs>

  <rect width="600" height="450" fill="url(#bgSoda)"/>

  <!-- Glass Cup -->
  <path d="M 230 110 L 250 400 L 350 400 L 370 110 Z" fill="#FFFFFF" fill-opacity="0.1" stroke="#FFFFFF" stroke-width="2"/>

  <!-- Cold Fizzing Cola Liquid -->
  <path d="M 236 140 L 250 400 L 350 400 L 364 140 Z" fill="url(#colaLiquid)"/>

  <!-- Foam Top -->
  <ellipse cx="300" cy="140" rx="64" ry="14" fill="#C67035"/>
  <ellipse cx="300" cy="138" rx="60" ry="10" fill="#EAD5B7"/>

  <!-- Ice Cubes -->
  <rect x="260" y="200" width="45" height="45" rx="6" fill="#FFFFFF" fill-opacity="0.5" stroke="#FFFFFF" stroke-width="1.5" transform="rotate(25 260 200)"/>
  <rect x="295" y="270" width="50" height="50" rx="6" fill="#FFFFFF" fill-opacity="0.4" stroke="#FFFFFF" stroke-width="1.5" transform="rotate(-10 295 270)"/>

  <!-- Red & White Straw -->
  <rect x="330" y="30" width="12" height="340" rx="4" fill="#FF0033" transform="rotate(10 330 30)"/>
  <rect x="330" y="60" width="12" height="15" fill="#FFFFFF" transform="rotate(10 330 30)"/>
  <rect x="330" y="100" width="12" height="15" fill="#FFFFFF" transform="rotate(10 330 30)"/>

  <!-- Title Badge Overlay -->
  <rect x="20" y="20" width="180" height="40" rx="20" fill="#FF0033"/>
  <text x="110" y="46" font-family="'Bebas Neue', sans-serif" font-size="24" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">🥤 GASEOSA FRÍA</text>
</svg>
