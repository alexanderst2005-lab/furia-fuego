<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="600" height="450">
  <defs>
    <radialGradient id="bgCombo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4A1000"/>
      <stop offset="100%" stop-color="#0A0A0A"/>
    </radialGradient>
  </defs>

  <rect width="600" height="450" fill="url(#bgCombo)"/>

  <!-- Left Side: Loaded Fries -->
  <g transform="translate(40, 180)">
    <path d="M 20 100 L 140 100 L 120 180 L 40 180 Z" fill="#FF0033"/>
    <rect x="50" y="30" width="12" height="90" rx="3" fill="#FFCC00" transform="rotate(-15 50 30)"/>
    <rect x="70" y="20" width="12" height="100" rx="3" fill="#FFCC00"/>
    <rect x="90" y="35" width="12" height="85" rx="3" fill="#FFCC00" transform="rotate(12 90 35)"/>
  </g>

  <!-- Center: La Bestia Triple Burger -->
  <g transform="translate(190, 100)">
    <path d="M 40 100 Q 110 30 180 100 Z" fill="#E29547"/>
    <rect x="30" y="105" width="160" height="20" rx="4" fill="#3D1A10"/>
    <rect x="35" y="125" width="150" height="10" fill="#FFCC00"/>
    <rect x="30" y="135" width="160" height="20" rx="4" fill="#3D1A10"/>
    <rect x="35" y="155" width="150" height="10" fill="#FFCC00"/>
    <rect x="30" y="165" width="160" height="20" rx="4" fill="#3D1A10"/>
    <path d="M 40 185 Q 110 230 180 185 Z" fill="#E29547"/>
  </g>

  <!-- Right Side: Iced Beverage Cup -->
  <g transform="translate(420, 140)">
    <path d="M 20 50 L 40 240 L 100 240 L 120 50 Z" fill="#FF5500" stroke="#FFFFFF" stroke-width="2"/>
    <ellipse cx="70" cy="50" rx="50" ry="12" fill="#FFFFFF"/>
    <rect x="65" y="0" width="10" height="60" rx="4" fill="#FF0033" transform="rotate(15 65 0)"/>
  </g>

  <!-- Title Badge Overlay -->
  <rect x="20" y="20" width="200" height="40" rx="20" fill="#FFCC00"/>
  <text x="120" y="46" font-family="'Bebas Neue', sans-serif" font-size="24" fill="#000000" text-anchor="middle" letter-spacing="1">💥 COMBO BESTIA</text>
</svg>
