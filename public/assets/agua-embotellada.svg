<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="600" height="450">
  <defs>
    <radialGradient id="bgWater" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#002B4A"/>
      <stop offset="100%" stop-color="#050A10"/>
    </radialGradient>
    <linearGradient id="waterLiquid" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E0F7FA"/>
      <stop offset="100%" stop-color="#80DEEA"/>
    </linearGradient>
  </defs>

  <rect width="600" height="450" fill="url(#bgWater)"/>

  <!-- Water Bottle Silhouette -->
  <path d="M 280 80 L 320 80 L 320 120 L 340 160 L 340 380 L 260 380 L 260 160 L 280 120 Z" fill="url(#waterLiquid)" fill-opacity="0.7" stroke="#FFFFFF" stroke-width="2"/>
  <!-- Bottle Blue Cap -->
  <rect x="275" y="65" width="50" height="15" rx="3" fill="#00AEEF"/>
  <!-- Bottle Label -->
  <rect x="260" y="220" width="80" height="70" fill="#002C6C" stroke="#00AEEF" stroke-width="1.5"/>
  <text x="300" y="260" font-family="'Outfit', sans-serif" font-weight="900" font-size="16" fill="#FFFFFF" text-anchor="middle">AGUA</text>
  <text x="300" y="278" font-family="'Barlow Condensed', sans-serif" font-weight="700" font-size="12" fill="#00AEEF" text-anchor="middle">PURIFICADA</text>

  <!-- Ice Droplets / Splash -->
  <circle cx="240" cy="200" r="4" fill="#FFFFFF" opacity="0.8"/>
  <circle cx="360" cy="260" r="5" fill="#FFFFFF" opacity="0.8"/>
  <circle cx="230" cy="300" r="6" fill="#FFFFFF" opacity="0.8"/>

  <!-- Title Badge Overlay -->
  <rect x="20" y="20" width="220" height="40" rx="20" fill="#00AEEF"/>
  <text x="130" y="46" font-family="'Bebas Neue', sans-serif" font-size="24" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">💧 AGUA EMBOTELLADA</text>
</svg>
