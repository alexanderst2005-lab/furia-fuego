<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="600" height="450">
  <defs>
    <radialGradient id="bgOreo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1A2035"/>
      <stop offset="100%" stop-color="#050811"/>
    </radialGradient>
  </defs>
  
  <rect width="600" height="450" fill="url(#bgOreo)"/>

  <!-- Dessert Cup Glass -->
  <path d="M 220 180 L 250 390 L 350 390 L 380 180 Z" fill="#FFFFFF" fill-opacity="0.15" stroke="#FFFFFF" stroke-width="2" stroke-opacity="0.4"/>
  <ellipse cx="300" cy="180" rx="80" ry="20" fill="#FFFFFF" fill-opacity="0.2"/>

  <!-- Layers of Ice Cream & Crushed Oreo -->
  <path d="M 245 350 L 250 390 L 350 390 L 355 350 Z" fill="#111111"/> <!-- Bottom Oreo Layer -->
  <path d="M 238 300 L 245 350 L 355 350 L 362 300 Z" fill="#FFFDD0"/> <!-- Vanilla Layer -->
  <path d="M 230 240 L 238 300 L 362 300 L 370 240 Z" fill="#222222"/> <!-- Crushed Oreo Layer -->
  <path d="M 222 180 L 230 240 L 370 240 L 378 180 Z" fill="#FFFDD0"/> <!-- Top Cream Layer -->

  <!-- Whipped Cream Swirl Peak -->
  <path d="M 240 180 C 240 120, 360 120, 360 180 Z" fill="#FFFFFF"/>
  <path d="M 260 160 C 270 100, 330 100, 340 160 Z" fill="#FFFDF0"/>

  <!-- Whole Oreo Biscuit on Top -->
  <circle cx="300" cy="110" r="38" fill="#1A1A1A" stroke="#333333" stroke-width="3"/>
  <circle cx="300" cy="110" r="30" fill="none" stroke="#555555" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="300" y="115" font-family="'Outfit', sans-serif" font-weight="900" font-size="14" fill="#FFFFFF" text-anchor="middle">OREO</text>

  <!-- Title Badge Overlay -->
  <rect x="20" y="20" width="180" height="40" rx="20" fill="#FFCC00"/>
  <text x="110" y="46" font-family="'Bebas Neue', sans-serif" font-size="24" fill="#000000" text-anchor="middle" letter-spacing="1">🍨 OREO CAOS</text>
</svg>
