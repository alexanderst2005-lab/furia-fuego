<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="600" height="450">
  <defs>
    <radialGradient id="bgDogDem" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4A000A"/>
      <stop offset="100%" stop-color="#0A0A0A"/>
    </radialGradient>
  </defs>

  <rect width="600" height="450" fill="url(#bgDogDem)"/>

  <!-- Golden Bun -->
  <path d="M 100 240 Q 300 130 500 240 Q 300 350 100 240 Z" fill="#E29547" stroke="#A85C1C" stroke-width="4"/>

  <!-- Jumbo Red Sausage -->
  <path d="M 120 230 Q 300 160 480 230 Q 300 290 120 230 Z" fill="#800000" stroke="#FF0033" stroke-width="2"/>

  <!-- Shredded Beef Topping Layer -->
  <path d="M 150 215 Q 300 180 450 215" stroke="#3A1A05" stroke-width="18" stroke-linecap="round"/>

  <!-- Melted Yellow Cheddar Stream -->
  <path d="M 140 210 Q 300 270 460 210" fill="none" stroke="#FFCC00" stroke-width="14" stroke-linecap="round"/>

  <!-- Crunchy Potato Sticks & Bacon Bits -->
  <circle cx="200" cy="220" r="4" fill="#FF5500"/>
  <circle cx="280" cy="210" r="5" fill="#FF0033"/>
  <circle cx="360" cy="230" r="4" fill="#FF5500"/>
  <circle cx="420" cy="215" r="5" fill="#FF0033"/>

  <!-- Title Badge Overlay -->
  <rect x="20" y="20" width="220" height="40" rx="20" fill="#FF0033"/>
  <text x="130" y="46" font-family="'Bebas Neue', sans-serif" font-size="24" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">🌭 HOT DOG DEMENCIAL</text>
</svg>
