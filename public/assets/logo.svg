<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="fireGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#800000" />
      <stop offset="35%" stop-color="#ff0033" />
      <stop offset="70%" stop-color="#ff5500" />
      <stop offset="100%" stop-color="#ffcc00" />
    </linearGradient>

    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffee77" />
      <stop offset="50%" stop-color="#ffcc00" />
      <stop offset="100%" stop-color="#ff8800" />
    </linearGradient>

    <linearGradient id="silverGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#dddddd" />
      <stop offset="100%" stop-color="#888888" />
    </linearGradient>

    <!-- Flame Glow Filter -->
    <filter id="flameGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12" result="blur1" />
      <feGaussianBlur stdDeviation="25" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <g transform="translate(400, 230)">
    <!-- Background Outer Flame Aura -->
    <path d="M0 -180 C80 -120 160 -40 140 60 C120 140 40 180 0 190 C-40 180 -120 140 -140 60 C-160 -40 -80 -120 0 -180 Z" 
          fill="url(#fireGrad)" opacity="0.3" filter="url(#flameGlow)" />

    <!-- Sharp Flame Crest Wings -->
    <!-- Left Wing Flames -->
    <path d="M -40,-20 C -90,-80 -160,-110 -220,-80 C -180,-30 -140,20 -180,90 C -130,50 -90,40 -40,-20 Z" fill="url(#fireGrad)" />
    <path d="M -30,-40 C -70,-100 -130,-140 -180,-120 C -140,-70 -110,-20 -130,40 C -90,10 -60,0 -30,-40 Z" fill="url(#goldGrad)" />
    
    <!-- Right Wing Flames -->
    <path d="M 40,-20 C 90,-80 160,-110 220,-80 C 180,-30 140,20 180,90 C 130,50 90,40 40,-20 Z" fill="url(#fireGrad)" />
    <path d="M 30,-40 C 70,-100 130,-140 180,-120 C 140,-70 110,-20 130,40 C 90,10 60,0 30,-40 Z" fill="url(#goldGrad)" />

    <!-- Center Flame Shield Emblem -->
    <path d="M 0,-150 C 45,-90 90,-40 80,40 C 70,110 0,150 0,150 C 0,150 -70,110 -80,40 C -90,-40 -45,-90 0,-150 Z" 
          fill="#0a0a0a" stroke="url(#fireGrad)" stroke-width="6" />

    <!-- Inner Core Flames -->
    <path d="M 0,-120 C 30,-70 60,-30 50,30 C 40,80 0,110 0,110 C 0,110 -40,80 -50,30 C -60,-30 -30,-70 0,-120 Z" 
          fill="url(#fireGrad)" />
    
    <path d="M 0,-80 C 20,-45 35,-20 30,20 C 25,50 0,75 0,75 C 0,75 -25,50 -30,20 C -35,-20 -20,-45 0,-80 Z" 
          fill="url(#goldGrad)" />

    <!-- Center '&' Sign Crest -->
    <text x="0" y="30" font-family="'Bebas Neue', 'Barlow Condensed', sans-serif" font-size="85" font-weight="900" 
          fill="#ffffff" text-anchor="middle" filter="drop-shadow(0 0 10px #ff0033)">
      &amp;
    </text>

    <!-- Main Typography: FURIA & FUEGO -->
    <!-- FURIA Banner -->
    <g transform="translate(0, 110)">
      <!-- Drop Shadow Text -->
      <text x="3" y="3" font-family="'Bebas Neue', sans-serif" font-size="110" font-weight="900" font-style="italic" 
            fill="#000000" text-anchor="middle" letter-spacing="6">
        FURIA
      </text>
      <!-- Main Text -->
      <text x="0" y="0" font-family="'Bebas Neue', sans-serif" font-size="110" font-weight="900" font-style="italic" 
            fill="url(#silverGrad)" stroke="#ff0033" stroke-width="3" text-anchor="middle" letter-spacing="6" filter="url(#flameGlow)">
        FURIA
      </text>
    </g>

    <!-- FUEGO Banner -->
    <g transform="translate(0, 190)">
      <!-- Drop Shadow Text -->
      <text x="3" y="3" font-family="'Bebas Neue', sans-serif" font-size="95" font-weight="900" font-style="italic" 
            fill="#000000" text-anchor="middle" letter-spacing="12">
        FUEGO
      </text>
      <!-- Main Text -->
      <text x="0" y="0" font-family="'Bebas Neue', sans-serif" font-size="95" font-weight="900" font-style="italic" 
            fill="url(#goldGrad)" stroke="#800000" stroke-width="2" text-anchor="middle" letter-spacing="12">
        FUEGO
      </text>
    </g>

    <!-- Tagline Banner -->
    <rect x="-240" y="215" width="480" height="30" fill="#ff0033" rx="4" />
    <text x="0" y="236" font-family="'Barlow Condensed', sans-serif" font-size="18" font-weight="900" 
          fill="#ffffff" text-anchor="middle" letter-spacing="5">
      EL HAMBRE NO SE COMBATE. SE DESATA.
    </text>
  </g>
</svg>
