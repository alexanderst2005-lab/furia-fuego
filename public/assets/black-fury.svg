<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="600" height="450">
  <defs>
    <radialGradient id="bgBlackFury" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1F002B"/>
      <stop offset="100%" stop-color="#05000A"/>
    </radialGradient>
    <linearGradient id="blackLiquid" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3A0A45"/>
      <stop offset="100%" stop-color="#0F0212"/>
    </linearGradient>
  </defs>

  <rect width="600" height="450" fill="url(#bgBlackFury)"/>

  <!-- Highball Glass -->
  <path d="M 230 110 L 250 400 L 350 400 L 370 110 Z" fill="#FFFFFF" fill-opacity="0.1" stroke="#FFFFFF" stroke-width="2" stroke-opacity="0.5"/>
  <ellipse cx="300" cy="110" rx="70" ry="15" fill="#FFFFFF" fill-opacity="0.2"/>

  <!-- Dark Mystery Liquid -->
  <path d="M 236 150 L 250 400 L 350 400 L 364 150 Z" fill="url(#blackLiquid)"/>
  <ellipse cx="300" cy="150" rx="64" ry="12" fill="#520D63"/>

  <!-- Ice Cubes inside Glass -->
  <rect x="260" y="220" width="45" height="45" rx="6" fill="#FFFFFF" fill-opacity="0.4" stroke="#FFFFFF" stroke-width="1.5" transform="rotate(15 260 220)"/>
  <rect x="295" y="280" width="50" height="50" rx="6" fill="#FFFFFF" fill-opacity="0.3" stroke="#FFFFFF" stroke-width="1.5" transform="rotate(-20 295 280)"/>

  <!-- Lime Slice Garnishing Rim -->
  <circle cx="230" cy="110" r="30" fill="#39FF14" stroke="#FFFFFF" stroke-width="3"/>
  <circle cx="230" cy="110" r="22" fill="#20B2AA"/>

  <!-- Black Straw -->
  <rect x="330" y="40" width="10" height="320" rx="4" fill="#111111" transform="rotate(12 330 40)"/>

  <!-- Title Badge Overlay -->
  <rect x="20" y="20" width="180" height="40" rx="20" fill="#800080"/>
  <text x="110" y="46" font-family="'Bebas Neue', sans-serif" font-size="24" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">🍸 BLACK FURY</text>
</svg>
