  <rect x="20" y="20" width="220" height="40" rx="20" fill="#FF5500"/>
  <text x="130" y="46" font-family="'Bebas Neue', sans-serif" font-size="24" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">🌶️ HOT DOG INFERNO</text>
